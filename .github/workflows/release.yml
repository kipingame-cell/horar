name: Test, build and release APK
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: horar-release
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test && npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: horar-test-signing-v1
      - run: gradle assembleDebug lintDebug --console=plain
      - name: Package
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Horar-1.0.0.apk
          zip -r Horar-1.0.0-web.zip dist
          sha256sum Horar-1.0.0.apk Horar-1.0.0-web.zip > SHA256SUMS.txt
      - name: Publish installable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.0-build.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" Horar-1.0.0.apk Horar-1.0.0-web.zip SHA256SUMS.txt --target "$GITHUB_SHA" --title "Хорар 1.0 · сборка ${GITHUB_RUN_NUMBER}" --notes-file docs/RELEASE.md
