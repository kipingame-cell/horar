name: Test and build release APK
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: horar-release
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test && npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle assembleRelease assembleReleaseAndroidTest lintRelease --console=plain
      - name: Verify offline catalog is packaged in release APK
        run: |
          python - <<'PYTHON'
          import zipfile,json,gzip
          with zipfile.ZipFile('app/build/outputs/apk/release/app-release-unsigned.apk') as apk:
              meta=json.loads(apk.read('assets/www/data/places-meta.json'))
              count=0
              for name in meta['files']:
                  raw=apk.read('assets/www/data/'+name.replace('.json.gz','.bin'))
                  count+=len(json.loads(gzip.decompress(raw)))
              assert count==meta['count'],(count,meta['count'])
              print('Verified bundled settlements:',count)
          PYTHON
      - name: Prepare temporary signatures for instrumenting the release binary
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/instrumentation.p12" -storetype PKCS12 -storepass android -keypass android -alias test -keyalg RSA -validity 2 -dname "CN=Instrumentation Only"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/instrumentation.p12" --ks-pass pass:android --key-pass pass:android --out app-for-tests.apk app/build/outputs/apk/release/app-release-unsigned.apk
          test_apks=(app/build/outputs/apk/androidTest/release/*.apk)
          test "${#test_apks[@]}" -eq 1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/instrumentation.p12" --ks-pass pass:android --key-pass pass:android --out instrumentation.apk "${test_apks[0]}"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app-for-tests.apk > apk-badging.txt
          if grep -q 'application-debuggable' apk-badging.txt; then exit 1; fi
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Test release binary on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size 1080x2400
            adb shell wm density 420
            adb install -r app-for-tests.apk
            adb install -r instrumentation.apk
            adb shell am instrument -w com.kipin.horar.test/com.kipin.horar.UiSmokeTest | tee smoke-result.txt
            adb pull /sdcard/Android/data/com.kipin.horar/files/screenshots ui-screenshots
            adb logcat -d > android-logcat.txt
            grep -q HORAR_SMOKE_OK smoke-result.txt
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Horar-Android-test-evidence
          path: |
            ui-screenshots
            smoke-result.txt
            apk-badging.txt
            android-logcat.txt
            app/build/reports/lint-results-release.html
      - name: Prepare release signing input
        run: |
          mkdir -p release-input
          cp app/build/outputs/apk/release/app-release-unsigned.apk release-input/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" release-input/
          cp apk-badging.txt release-input/
          zip -r release-input/Horar-1.6.0-test-evidence.zip ui-screenshots smoke-result.txt apk-badging.txt app/build/reports/lint-results-release.html
          zip -r release-input/Horar-1.6.0-web.zip dist
      - uses: actions/upload-artifact@v4
        with:
          name: Horar-release-signing-input
          path: release-input
          retention-days: 7
